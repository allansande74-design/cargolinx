<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Altovex Global Logistics">
  <title>Altovex Global Logistics</title>
  <!-- globe: a ring with two meridians and the equator, gold on navy -->
  <g fill="none" stroke="#c9a227" stroke-width="2.6">
    <circle cx="32" cy="32" r="19"/>
    <ellipse cx="32" cy="32" rx="8" ry="19"/>
    <path d="M13 32h38"/>
    <path d="M17 20.5c9 4.2 21 4.2 30 0"/>
    <path d="M17 43.5c9-4.2 21-4.2 30 0"/>
  </g>
  <!-- an arrow leaving the ring: freight moving out -->
  <path d="M46 20l12-6-3 12z" fill="#c9a227"/>
  <text x="66" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1.2">ALTOVEX</text>
  <text x="67" y="48" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c9a227" letter-spacing="3.4">GLOBAL LOGISTICS</text>
</svg>
