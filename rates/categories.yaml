# Cargo categories for the DDP rate card.
#
# A flat DDP rate is only safe inside a defined band, because duty and VAT scale with the
# declared value and the duty rate scales with the HS line. Each category therefore carries:
#   * the duty tier its HS lines sit in (EAC CET 0 / 10 / 25 / 35);
#   * a REFERENCE declared value per chargeable unit — the typical value density of cargo in
#     that category. The card publishes the all-in DDP price at that reference;
#   * a CEILING — the highest value density we will carry at card terms. Above it the cargo is
#     quoted case by case, because the band price would not cover the duty.
#
# Between reference and ceiling, duty and VAT are charged at actual on the invoice: above the
# reference the client pays the difference, below it the difference comes off. Duty is never
# marked up in either direction, so the mechanism is exact and the service rate holds.
#
# The HS range is indicative; the classification decides, and the desk confirms it before the
# cargo moves.

categories:
  - code: A
    name: "Machinery, plant and capital equipment"
    hs: "84.01–84.80, 85.01–85.04 (most lines)"
    duty: 0.00
    reference_sea: 3000.0    # USD of declared value per W/M
    ceiling_sea: 6000.0
    reference_air: 100.0     # USD of declared value per chargeable kg
    ceiling_air: 400.0
    examples: "generators, pumps, compressors, solar inverters, food-processing plant"
  - code: B
    name: "Raw materials, packaging and intermediate goods"
    hs: "chapters 39–48 partly, 72 partly, 76 partly"
    duty: 0.10
    reference_sea: 1200.0
    ceiling_sea: 2500.0
    reference_air: 30.0
    ceiling_air: 150.0
    examples: "resin, film, cartons, steel sections, aluminium sheet, assembly components"
  - code: C
    name: "General goods and hardware"
    hs: "73, 82, 83, 94 partly, 96 partly"
    duty: 0.25
    reference_sea: 800.0
    ceiling_sea: 1500.0
    reference_air: 15.0
    ceiling_air: 100.0
    examples: "tools, fasteners, sanitaryware, furniture parts, household goods"
  - code: D
    name: "Electronics, appliances and mobile devices"
    hs: "84.71, 85.09, 85.13, 85.16, 85.17, 85.18, 85.27–85.29"
    duty: 0.25
    reference_sea: 2500.0
    ceiling_sea: 5000.0
    reference_air: 150.0
    ceiling_air: 350.0
    examples: "laptops, phones, monitors, televisions, small appliances"
  - code: E
    name: "Textiles, apparel and footwear"
    hs: "chapters 50–64"
    duty: 0.35
    reference_sea: 1000.0
    ceiling_sea: 2000.0
    reference_air: 30.0
    ceiling_air: 120.0
    examples: "fabric, uniforms, finished garments, shoes"

excluded:
  - group: "Restricted and licensed"
    items: "pharmaceuticals, cosmetics, food and food supplements, medical devices"
    reason: "PPB, KEBS or port-health registration before shipment; handled as a project, not a rate"
  - group: "High-duty and excisable"
    items: "alcohol, tobacco, sugar, confectionery, motor vehicles, petroleum"
    reason: "duty and excise make a per-unit rate meaningless; quoted on the specific HS line"
  - group: "Hazardous and dangerous goods"
    items: "lithium batteries shipped loose, aerosols, solvents, paints, chemicals, gas cylinders"
    reason: "IATA/IMDG declaration and carrier acceptance; per-shipment approval only"
  - group: "Perishable and temperature-controlled"
    items: "fresh food, flowers, chilled and frozen cargo, live plants"
    reason: "cold chain and shelf life; air only, booked case by case"
  - group: "High value and sensitive"
    items: "gold, gemstones, cash, artworks, brand-name goods without licence, arms and ammunition"
    reason: "cover, custody and licensing; not accepted on a rate card"
  - group: "Above the category ceiling"
    items: "any cargo declaring above the value ceiling for its category"
    reason: "the band price would not cover the duty; quoted at actual value in writing"
